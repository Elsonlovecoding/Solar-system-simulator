# ============================================================================
#  solar.conf — Solar System body definitions
#  Parsed at startup by src/config.js. All values are SI units:
#    mass [kg], radius [m], x/y [m], period [s], inclination/tilt [degrees]
#
#  Each [astral] section defines one body.
#    star   : x, y ignored at runtime (Sun wobbles about the origin)
#    planet : x, y = initial position relative to the Sun; the simulator gives
#             it a circular-orbit speed v = sqrt(G*M/r), perpendicular, CCW
#    moon   : x, y = initial offset from its parent; orbit radius and phase
#             are derived from the offset; period sets the Kepler motion
# ============================================================================

